<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6558D3">
<title>Ledgerly — Personal Finance Dashboard</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#172033;--muted:#687386;--line:#e4e7ee;--violet:#6558d3;--violet2:#eeeafd;--green:#16845b;--greenbg:#e6f6ef;--orange:#c96b16;--orangebg:#fff0df;--blue:#2767b1;--bluebg:#e9f2ff;--navy:#17223b;--danger:#c43d45;--shadow:0 5px 22px #17203310;--r:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
aside{width:238px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;padding:4px 10px 24px}.logo{width:34px;height:34px;border-radius:11px;background:var(--violet);display:grid;place-items:center;color:white;font-weight:900}
nav button{width:100%;display:flex;align-items:center;gap:11px;background:transparent;color:#596477;text-align:left;padding:11px 12px;border-radius:11px;margin:2px 0;min-height:44px}nav button.active{background:var(--violet2);color:var(--violet);font-weight:700}nav svg{width:19px;height:19px;flex:none}
main{margin-left:238px;width:calc(100% - 238px)}header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:8}.top-actions{display:flex;gap:8px;align-items:center}.btn{min-height:44px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:650}.btn.primary{background:var(--violet);color:#fff;border-color:var(--violet)}.btn.danger{background:#fff4f4;color:var(--danger);border-color:#f0c8ca}.btn:disabled{opacity:.55;cursor:not-allowed}
.content{padding:26px;max-width:1500px;margin:auto}.page-title{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.page-title h1{font-size:27px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:19px}.metric{font-size:27px;font-weight:800;margin:7px 0}.metric.notset{font-size:21px}.metric.green{color:var(--green)}.metric.orange{color:var(--orange)}.metric.blue{color:var(--blue)}.strip{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.empty{min-height:145px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:25px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar>*{min-height:44px}.input,.select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-width:150px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:12px;color:var(--muted);font-weight:750}.amount{font-weight:750;white-space:nowrap}.income{color:var(--green)}.expense{color:#273142}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;background:#eef0f5;font-size:12px;margin:2px}.pill button{background:none;padding:0;color:var(--muted);font-weight:800}.inline-select{border:1px solid var(--line);border-radius:8px;padding:6px;background:white}.tag-plus{width:28px;height:28px;border-radius:7px;background:var(--violet2);color:var(--violet);font-weight:800}
.bar{height:9px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--violet);border-radius:inherit}.dangerbar i{background:var(--orange)}
.stat-row{display:flex;justify-content:space-between;gap:10px;margin:9px 0}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.period{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px}.notice{padding:12px 14px;border-radius:11px;background:var(--bluebg);color:#244c7d;margin-bottom:15px}.success{padding:11px 13px;border-radius:10px;background:var(--greenbg);color:#176746}.warning{padding:11px 13px;border-radius:10px;background:var(--orangebg);color:#8c4e13}
.chart{height:230px;position:relative}.chart svg{width:100%;height:100%}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--violet);margin-right:5px}.dot.orange{background:#d98738}.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;background:#edf0f4;display:grid;place-items:center}.donut:after{content:"";width:88px;height:88px;background:white;border-radius:50%}.donut.emptydonut{background:conic-gradient(#e7eaf0 0 100%)}
.modal-bg{position:fixed;inset:0;background:#11182780;display:none;place-items:center;padding:15px;z-index:30}.modal-bg.show{display:grid}.modal{background:#fff;border-radius:17px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0}.close{width:40px;height:40px;border-radius:9px;background:#f1f2f5}.modal-body{padding:19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:650;font-size:13px}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:white}.field textarea{min-height:90px}.modal-foot{padding:14px 19px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.segment{display:flex;border:1px solid var(--line);padding:3px;border-radius:10px}.segment button{flex:1;min-height:38px;border-radius:8px;background:white}.segment button.active{background:var(--violet2);color:var(--violet);font-weight:750}
.mobilebar{display:none}.hide{display:none!important}.kicker{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}
@media(max-width:720px){aside{display:none}main{margin:0;width:100%;padding-bottom:76px}header{height:64px;padding:0 14px}.content{padding:18px 14px}.page-title{align-items:flex-start;flex-direction:column}.page-title h1{font-size:24px}.top-actions .label{display:none}.cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.metric{font-size:21px}.metric.notset{font-size:18px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.mobilebar{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);overflow-x:auto;box-shadow:0 -4px 18px #17203312}.mobilebar button{min-width:76px;background:white;color:#667084;display:grid;place-items:center;gap:2px;padding:6px 4px;font-size:11px}.mobilebar button.active{color:var(--violet);font-weight:750}.mobilebar svg{width:20px;height:20px}.toolbar .input{flex:1;min-width:140px}.toolbar .select{min-width:130px}}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand"><div class="logo">L</div>Ledgerly</div><nav id="sideNav"></nav></aside>
<main>
<header><strong id="mobileTitle">Dashboard</strong><div class="top-actions"><button class="btn" onclick="sync()">↻ <span class="label">Drive sync</span></button><button class="btn" onclick="openImport()">↑ <span class="label">Import</span></button><button class="btn primary" onclick="openEntry()">＋ <span class="label">Add entry</span></button></div></header>
<div id="content" class="content"></div>
</main>
<div class="mobilebar" id="mobileNav"></div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const icons={
dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
transactions:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
recurring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.3 9A7 7 0 0 1 18.8 7M17.7 15A7 7 0 0 1 5.2 17"/></svg>',
subscriptions:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>',
budgets:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
goals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m15 9 4-4"/></svg>',
documents:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>',
rules:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.4 1.4-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20h-2v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L9 17.2l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H7v-2h.8a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L9 9.2l1.4-1.4.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V6h2v.6a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.4 1.4-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.8v2h-.8a1.7 1.7 0 0 0-1.6 1z"/></svg>'};
const pages=[['dashboard','Dashboard'],['transactions','Transactions'],['recurring','Recurring'],['subscriptions','Subscriptions'],['budgets','Budgets'],['goals','Goals'],['documents','Documents'],['rules','Rules'],['settings','Settings']];
const defaultState={transactions:[],documents:[],goals:[],budgets:[],subscriptions:[],recurring:[],rules:[],tags:[],dismissed:[],categories:['Housing','Groceries','Shopping','Dining','Transportation','Utilities','Subscriptions','Insurance','Health','Entertainment','Income','Needs review','Other'],accounts:['Main Checking','Everyday Visa','Rewards Card','Cash'],period:'all-time',assets:0,liabilities:0,netWorthConfigured:false,drive:{folderName:'Ledgerly Financial Inbox',folderUrl:'',schedule:'08:00 daily',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,lastSync:null,status:'Not connected',imported:0,duplicates:0,review:0,errors:[]}};
let state=load();let page='dashboard';let entryType='expense';let txSearch='';let accountFilter='';let categoryFilter='';
function load(){try{let x=JSON.parse(localStorage.getItem('ledgerly-standalone'));return x?Object.assign(defaultState,x):structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem('ledgerly-standalone',JSON.stringify(state))}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function periodStart(p=state.period){let d=new Date();d.setHours(0,0,0,0);if(p==='this-month')return new Date(d.getFullYear(),d.getMonth(),1);if(p==='last-month')return new Date(d.getFullYear(),d.getMonth()-1,1);if(p==='last-3-months')return new Date(d.getFullYear(),d.getMonth()-2,1);if(p==='last-6-months')return new Date(d.getFullYear(),d.getMonth()-5,1);if(p==='this-year')return new Date(d.getFullYear(),0,1);return null}
function filteredTx(){let start=periodStart();return state.transactions.filter(t=>{let ok=!start||new Date(t.date+'T00:00:00')>=start;if(page==='transactions'){ok=ok&&(!txSearch||[t.merchant,t.category,t.account,...(t.tags||[])].join(' ').toLowerCase().includes(txSearch.toLowerCase()))&&(!accountFilter||t.account===accountFilter)&&(!categoryFilter||t.category===categoryFilter)}return ok}).sort((a,b)=>b.date.localeCompare(a.date))}
function nav(){let s=document.getElementById('sideNav'),m=document.getElementById('mobileNav');s.innerHTML=pages.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${icons[k]}<span>${n}</span></button>`).join('');m.innerHTML=pages.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${icons[k]}<span>${n}</span></button>`).join('');document.getElementById('mobileTitle').textContent=pages.find(x=>x[0]===page)[1]}
function go(p){page=p;nav();render()}
function render(){nav();let el=document.getElementById('content');el.innerHTML=({dashboard:dashboard,transactions:transactions,recurring:recurring,subscriptions:subscriptions,budgets:budgets,goals:goals,documents:documents,rules:rules,settings:settings})[page]()}
function periodControl(){return `<select class="period" onchange="setPeriod(this.value)">${[['all-time','All time'],['this-month','This month'],['last-month','Last month'],['last-3-months','Last 3 months'],['last-6-months','Last 6 months'],['this-year','This year']].map(x=>`<option value="${x[0]}" ${state.period===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`}
function setPeriod(v){let old=state.period;state.period=v;try{save();render()}catch(e){state.period=old;alert('Could not save the period.')}}

function dashboard(){let tx=filteredTx(),income=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),spend=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),rate=income?((income-spend)/income*100):0;let recent=tx.slice(0,5);let cats={};tx.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);let total=Object.values(cats).reduce((a,b)=>a+b,0);let has=state.transactions.length>0;
return `<div class="page-title"><div><h1>Dashboard</h1><div class="muted">A clear view of your saved financial data.</div></div>${periodControl()}</div>
<div class="grid cards">
<div class="card"><div class="kicker">Net Worth</div><div class="metric ${state.netWorthConfigured?'':'notset'}">${state.netWorthConfigured?money(state.assets-state.liabilities):'Not set'}</div><div class="muted small">${state.netWorthConfigured?'Assets − liabilities':'Set your assets and liabilities in Settings.'}</div><div class="strip"><button class="btn" onclick="go('settings')">Set up net worth</button></div></div>
<div class="card"><div class="kicker">Income</div><div class="metric green">${money(income)}</div><div class="muted small">${tx.length} transaction${tx.length===1?'':'s'} in period</div><div class="strip">${has?'Real saved data':'No data yet'}</div></div>
<div class="card"><div class="kicker">Spending</div><div class="metric orange">${money(spend)}</div><div class="muted small">Expenses in selected period</div><div class="strip">${has?'Calculated from transactions':'No data yet'}</div></div>
<div class="card"><div class="kicker">Savings rate</div><div class="metric blue">${rate.toFixed(1)}%</div><div class="muted small">((income − spending) ÷ income)</div><div class="strip">${income?'Calculated':'Income is $0.00'}</div></div></div>
<div class="grid two section"><div class="card"><h2>Cash flow</h2>${has?cashChart():`<div class="empty"><div><strong>No cash-flow data yet</strong>Import or add transactions to see cash flow.</div></div>`}</div>
<div class="card"><h2>Spending by category</h2>${total?donut(cats,total):`<div class="empty"><div><strong>No spending data yet</strong>Add or import expenses to see category spending.</div></div>`}</div></div>
<div class="grid two section"><div class="card"><h2>Recent activity</h2>${recent.length?txRows(recent,true):`<div class="empty"><div><strong>No recent activity</strong>Your newest saved transactions will appear here.</div></div>`}</div>
<div class="card"><h2>Ledgerly insight</h2><div class="empty">${state.transactions.length?`<div><strong>${state.transactions.filter(t=>t.category==='Needs review').length} transaction(s) need review</strong>This is based only on your saved transaction categories.</div>`:`<div><strong>No insights yet</strong>Add or import real financial data to generate factual summaries.</div>`}</div><h2>Coming up</h2>${upcoming()}</div></div>`}
function cashChart(){let months=[];let now=new Date();for(let i=6;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),key=d.toISOString().slice(0,7);let inc=0,exp=0;state.transactions.forEach(t=>{if(t.date.startsWith(key)){if(t.type==='income')inc+=t.amount;else exp+=t.amount}});months.push({key,inc,exp})}let max=Math.max(1,...months.flatMap(x=>[x.inc,x.exp]));let w=700,h=190, pts=(kind)=>months.map((x,i)=>`${i*(w/6)},${h-20-(x[kind]/max)*(h-35)}`).join(' ');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts('inc')}" fill="none" stroke="#6558D3" stroke-width="3"/><polyline points="${pts('exp')}" fill="none" stroke="#d98738" stroke-width="3"/>${months.map((x,i)=>`<text x="${i*(w/6)}" y="${h-2}" font-size="11" fill="#687386" text-anchor="${i?'middle':'start'}">${x.key.slice(5)}</text>`).join('')}</svg></div><div class="legend"><span><i class="dot"></i>Income</span><span><i class="dot orange"></i>Expenses</span></div>`}
function donut(c,total){let arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);let deg=0,stops=arr.map(([k,v])=>{let a=v/total*360,s=`${deg}deg ${deg+a}deg`;deg+=a;return s}).join(',');return `<div class="donut" style="background:conic-gradient(#6558D3 0 ${arr[0][1]/total*360}deg,${arr.slice(1).map((x,i)=>{let prev=arr.slice(0,i+1).reduce((a,b)=>a+b[1],0);return `hsl(${250-i*28} 55% 58%) ${prev/total*360}deg ${prev/total*360+x[1]/total*360}deg`}).join(',')})"></div><div class="list">${arr.map(([k,v])=>`<div class="stat-row"><span>${esc(k)}</span><strong>${money(v)} · ${(v/total*100).toFixed(1)}%</strong></div>`).join('')}</div>`}
function upcoming(){let a=[...state.recurring.filter(x=>x.active),...state.subscriptions.filter(x=>x.active)].sort((a,b)=>(a.nextDate||a.nextRenewal||'').localeCompare(b.nextDate||b.nextRenewal||'')).slice(0,3);return a.length?`<div class="list">${a.map(x=>`<div class="item"><div class="item-head"><strong>${esc(x.name||x.service)}</strong><span>${money(x.amount)}</span></div><div class="muted small">Due ${esc(x.nextDate||x.nextRenewal||'')}</div></div>`).join('')}</div>`:`<div class="empty"><div><strong>Nothing confirmed yet</strong><button class="btn" onclick="go('recurring')">Open Recurring</button></div></div>`}

function transactions(){let tx=filteredTx();return `<div class="page-title"><div><h1>Transactions</h1><div class="muted">Search, filter, categorize and tag saved entries.</div></div><button class="btn primary" onclick="openEntry()">＋ Add entry</button></div>
<div class="toolbar"><input class="input" placeholder="Search merchant, category or tag" value="${esc(txSearch)}" oninput="txSearch=this.value;render()"><select class="select" onchange="accountFilter=this.value;render()"><option value="">All accounts</option>${state.accounts.map(a=>`<option ${accountFilter===a?'selected':''}>${esc(a)}</option>`).join('')}</select><select class="select" onchange="categoryFilter=this.value;render()"><option value="">All categories</option>${state.categories.map(a=>`<option ${categoryFilter===a?'selected':''}>${esc(a)}</option>`).join('')}</select>${periodControl()}</div>
<div class="card">${tx.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date / merchant</th><th>Category</th><th>Account</th><th>Tags</th><th>Amount</th><th></th></tr></thead><tbody>${txRows(tx,false)}</tbody></table></div>`:`<div class="empty"><div><strong>No transactions yet</strong>Add an entry or import a statement to begin.</div></div>`}</div>`}
function txRows(tx,compact){return tx.map(t=>`<tr><td><strong>${esc(t.merchant)}</strong><div class="muted small">${esc(t.date)}${t.receipt?' · 🧾 receipt':''}</div></td><td><select class="inline-select" onchange="changeCat('${t.id}',this.value)">${state.categories.map(c=>`<option ${c===t.category?'selected':''}>${esc(c)}</option>`).join('')}</select></td><td>${esc(t.account)}</td><td>${(t.tags||[]).map(tag=>`<span class="pill">${esc(tag)} <button onclick="removeTag('${t.id}','${esc(tag)}')" aria-label="Remove ${esc(tag)}">×</button></span>`).join('')}<button class="tag-plus" onclick="tagModal('${t.id}')">+</button></td><td class="amount ${t.type}">${t.type==='income'?'+':'−'}${money(t.amount)}</td><td>${compact?'':`<button class="btn" onclick="deleteTx('${t.id}')">Delete</button>`}</td></tr>`).join('')}
function changeCat(id,v){let t=state.transactions.find(x=>x.id===id);if(t){t.category=v;save();render()}}
function removeTag(id,tag){let t=state.transactions.find(x=>x.id===id);if(t){t.tags=t.tags.filter(x=>x.toLowerCase()!==tag.toLowerCase());save();render()}}
function tagModal(id){let t=state.transactions.find(x=>x.id===id);showModal(`<div class="modal-head"><h3>Edit tags</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><p class="muted">Select existing tags or create one by name.</p><div>${state.tags.map(x=>`<label class="pill"><input type="checkbox" class="tagpick" value="${esc(x)}" ${(t.tags||[]).includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div><div class="field" style="margin-top:15px"><label>New tag</label><input id="newTag" placeholder="Tag name"></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTags('${id}')">Save</button></div>`)}
function saveTags(id){let t=state.transactions.find(x=>x.id===id);let tags=[...document.querySelectorAll('.tagpick:checked')].map(x=>x.value);let n=document.getElementById('newTag').value.trim();if(n&&!state.tags.some(x=>x.toLowerCase()===n.toLowerCase())){state.tags.push(n);tags.push(n)}t.tags=[...new Set(tags.map(x=>x.trim()).filter(Boolean))];save();closeModal();render()}

function openEntry(){entryType='expense';showModal(`<div class="modal-head"><h3>Add entry</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="segment"><button id="segE" class="active" onclick="entryType='expense';document.getElementById('segE').classList.add('active');document.getElementById('segI').classList.remove('active')">Expense</button><button id="segI" onclick="entryType='income';document.getElementById('segI').classList.add('active');document.getElementById('segE').classList.remove('active')">Income</button></div><div class="formgrid" style="margin-top:15px"><div class="field"><label>Amount</label><input id="eAmount" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Merchant or source</label><input id="eMerchant" placeholder="e.g. Employer or store"></div><div class="field"><label>Date</label><input id="eDate" type="date" value="${today()}"></div><div class="field"><label>Category</label><select id="eCat">${state.categories.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Account</label><select id="eAcc">${state.accounts.length?state.accounts.map(x=>`<option>${esc(x)}</option>`).join(''):`<option value="">Add an account in Settings</option>`}</select></div><div class="field"><label>Tags</label><input id="eTags" placeholder="comma-separated tags"></div><div class="field full"><label><input id="eReceipt" type="checkbox"> I have a receipt to attach</label><input id="eFile" type="file" hidden accept="image/*,.pdf,.csv,.xlsx,.xls" onchange="document.getElementById('fileName').textContent=this.files[0]?.name||''"><button class="btn" onclick="document.getElementById('eFile').click()">Choose receipt</button><span id="fileName" class="muted small"></span></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEntry()">Save entry</button></div>`)}
function saveEntry(){let amount=Number(document.getElementById('eAmount').value),merchant=document.getElementById('eMerchant').value.trim(),date=document.getElementById('eDate').value,account=document.getElementById('eAcc').value;if(!amount||amount<=0||!merchant||!date||!account){alert('Please enter a valid amount, merchant/source, date, and account.');return}let tags=(document.getElementById('eTags').value||'').split(',').map(x=>x.trim()).filter(Boolean);tags.forEach(t=>{if(!state.tags.some(x=>x.toLowerCase()===t.toLowerCase()))state.tags.push(t)});let fp=`${date}|${merchant.toLowerCase()}|${amount.toFixed(2)}|${account.toLowerCase()}`;if(state.transactions.some(t=>t.fingerprint===fp)){alert('This entry matches an existing transaction and was not duplicated.');return}let f=document.getElementById('eFile').files[0];state.transactions.push({id:crypto.randomUUID(),date,merchant,category:document.getElementById('eCat').value,amount,type:entryType,account,tags:[...new Set(tags)],receipt:!!f,source:'manual',fingerprint:fp,createdAt:new Date().toISOString()});save();closeModal();render()}

function openImport(){showModal(`<div class="modal-head"><h3>Import data</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice"><strong>CSV statements</strong><br>Choose a CSV to preview and import common date, description/merchant, amount, debit, credit, category and account columns.</div><div class="field"><label>CSV or document files</label><input id="importFiles" type="file" multiple accept=".csv,.pdf,.png,.jpg,.jpeg,.xlsx,.xls,.txt"></div><p id="importStatus" class="muted small">No sample financial data is included.</p></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="handleImport()">Preview / import</button></div>`)}
function parseCSV(s){let rows=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'&&s[i+1]==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell=''}else if((c==='\\n'||c==='\\r')&&!q){if(c==='\\r'&&s[i+1]==='\\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function handleImport(){let files=document.getElementById('importFiles').files;if(!files.length){alert('Choose a file first.');return}let csv=[...files].find(f=>f.name.toLowerCase().endsWith('.csv'));if(!csv){document.getElementById('importStatus').textContent=`${files.length} file(s) selected. In standalone mode, non-CSV originals are not uploaded to server storage.`;return}let r=new FileReader();r.onload=()=>{let rows=parseCSV(r.result),h=rows[0].map(x=>x.trim().toLowerCase()),find=(names)=>{let i=h.findIndex(x=>names.some(n=>x===n||x.includes(n)));return i};let di=find(['date','transaction date']),mi=find(['description','merchant','payee','details']),ai=find(['amount','value']),db=find(['debit','withdrawal']),cr=find(['credit','deposit']),ci=find(['category']),ac=find(['account']);if(di<0||mi<0||(ai<0&&db<0&&cr<0)){document.getElementById('importStatus').textContent='Column mapping is ambiguous. Required: date, merchant/description, and amount or debit/credit.';return}let inserted=0,dup=0,skip=0;for(let i=1;i<rows.length;i++){let x=rows[i],date=normDate(x[di]),merchant=(x[mi]||'').trim();let raw=ai>=0?x[ai]:(x[db]||x[cr]||'');let amount=Math.abs(Number(String(raw).replace(/[^0-9.-]/g,'')));let type=ai>=0?(Number(String(raw).replace(/[^0-9.-]/g,''))<0?'expense':'income'):(x[db]? 'expense':'income');if(!date||!merchant||!isFinite(amount)||amount<=0){skip++;continue}let account=ac>=0&&x[ac].trim()?x[ac].trim():(state.accounts[0]||'Imported account');let category=ci>=0&&x[ci].trim()?x[ci].trim():'Needs review';if(!state.categories.includes(category))category='Needs review';let fp=`${date}|${merchant.toLowerCase()}|${amount.toFixed(2)}|${account.toLowerCase()}`;if(state.transactions.some(t=>t.fingerprint===fp)){dup++;continue}state.transactions.push({id:crypto.randomUUID(),date,merchant,category,amount,type,account,tags:[],receipt:false,source:'csv',fingerprint:fp,createdAt:new Date().toISOString()});inserted++}save();document.getElementById('importStatus').innerHTML=`Imported <strong>${inserted}</strong>, duplicates <strong>${dup}</strong>, skipped <strong>${skip}</strong>.`;setTimeout(()=>{closeModal();go('transactions')},700)};r.readAsText(csv)}
function normDate(v){v=String(v||'').trim();if(/^\\d{4}-\\d{2}-\\d{2}$/.test(v))return v;let d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10)}
function deleteTx(id){if(confirm('Delete this transaction?')){state.transactions=state.transactions.filter(x=>x.id!==id);save();render()}}

function recurring(){let sug=detect();return `<div class="page-title"><div><h1>Recurring</h1><div class="muted">Confirmed recurring payments plus suggestions derived from real repeated expenses.</div></div><button class="btn primary" onclick="manualRecurring()">＋ Add recurring payment</button></div><div class="notice"><strong>Active detection</strong><br>Suggestions require repeated dated expense transactions. They are never confirmed automatically.</div><div class="grid two"><div class="card"><h2>Suggestions</h2>${sug.length?`<div class="list">${sug.map(suggestionCard).join('')}</div>`:`<div class="empty"><div><strong>No recurring suggestions</strong>Add/import repeated expense transactions to detect stable patterns.</div></div>`}</div><div class="card"><h2>Confirmed payments</h2>${state.recurring.length?`<div class="list">${state.recurring.map(x=>confirmedItem(x,'recurring')).join('')}</div>`:`<div class="empty"><div><strong>No recurring payments</strong>Use Add recurring payment when you have a confirmed bill.</div></div>`}</div></div>`}
function subscriptions(){let sug=detect().filter(x=>x.subscription);return `<div class="page-title"><div><h1>Subscriptions</h1><div class="muted">Stable subscription patterns and confirmed renewals.</div></div><button class="btn primary" onclick="manualSubscription()">＋ Add subscription</button></div><div class="grid cards"><div class="card"><div class="kicker">Monthly total</div><div class="metric">${money(state.subscriptions.filter(x=>x.active).reduce((a,x)=>a+monthly(x.amount,x.cadence),0))}</div></div><div class="card"><div class="kicker">Annual total</div><div class="metric">${money(state.subscriptions.filter(x=>x.active).reduce((a,x)=>a+monthly(x.amount,x.cadence)*12,0))}</div></div><div class="card"><div class="kicker">Next renewal</div><div class="metric notset">${state.subscriptions.filter(x=>x.active).sort((a,b)=>(a.nextRenewal||'').localeCompare(b.nextRenewal||''))[0]?.nextRenewal||'None'}</div></div></div><div class="grid two section"><div class="card"><h2>Subscription suggestions</h2>${sug.length?`<div class="list">${sug.map(suggestionCard).join('')}</div>`:`<div class="empty"><div><strong>No subscription suggestions</strong>No stable real-data pattern is available yet.</div></div>`}</div><div class="card"><h2>Confirmed subscriptions</h2>${state.subscriptions.length?`<div class="list">${state.subscriptions.map(x=>confirmedItem(x,'subscription')).join('')}</div>`:`<div class="empty"><div><strong>No subscriptions</strong>Nothing has been confirmed or added yet.</div></div>`}</div></div>`}
function normalize(m){return m.toLowerCase().trim().replace(/[#][0-9]+$/,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\d{5,}/g,' ').replace(/\s+/g,' ').trim()}
const subHints=['netflix','spotify','hulu','disney','youtube','icloud','dropbox','adobe','microsoft','amazon prime','patreon','membership','studio','gym','openai','chatgpt','canva','notion','zoom','slack','github'];
const billHints=['mortgage','rent','loan','insurance','utility','utilities','electric','water','internet','phone','mobile','daycare','tuition','lease','car payment','auto payment','hoa','property tax'];
function detect(){let groups={};state.transactions.filter(t=>t.type==='expense').forEach(t=>(groups[normalize(t.merchant)]??=[]).push(t));let out=[];Object.entries(groups).forEach(([m,a])=>{let dates=[...new Set(a.map(x=>x.date))].sort();if(dates.length<2)return;let ints=dates.slice(1).map((d,i)=>(new Date(d)-new Date(dates[i]))/86400000),avgInt=ints.reduce((x,y)=>x+y,0)/ints.length;let cadence=avgInt>=5&&avgInt<=9?'weekly':avgInt>=12&&avgInt<=17?'biweekly':avgInt>=24&&avgInt<=40?'monthly':avgInt>=75&&avgInt<=110?'quarterly':avgInt>=330&&avgInt<=400?'annual':null;if(!cadence)return;let amounts=a.map(x=>x.amount),av=amounts.reduce((x,y)=>x+y,0)/amounts.length,variation=Math.max(...amounts.map(x=>Math.abs(x-av)/av));let hint=subHints.some(h=>m.includes(h))||a.some(x=>(x.tags||[]).some(t=>t.toLowerCase()==='subscription')||x.category.toLowerCase().includes('subscription'));let bill=billHints.some(h=>m.includes(h)||a.some(x=>x.category.toLowerCase().includes(h)));if(variation>(hint?.20:.35))return;if(!hint&&!bill&&(a.length<3||variation>.03||!['monthly','quarterly','annual'].includes(cadence)))return;let jitter=Math.max(...ints.map(x=>Math.abs(x-avgInt)));let confidence=a.length>=3&&variation<=.12&&jitter<=5?'High confidence':'Likely';let next=new Date(dates[dates.length-1]+'T00:00:00');next.setDate(next.getDate()+Math.round(avgInt));let key=m+'|'+cadence; if(!state.dismissed.includes(key))out.push({key,merchant:a[0].merchant,category:a[0].category,cadence,count:a.length,confidence,avg:av,monthly:monthly(av,cadence),next:next.toISOString().slice(0,10),subscription:hint})});return out}
function monthly(a,c){return c==='weekly'?a*52/12:c==='biweekly'?a*26/12:c==='quarterly'?a/3:c==='annual'?a/12:a}
function suggestionCard(s){return `<div class="item"><div class="item-head"><strong>${esc(s.merchant)}</strong><strong>${money(s.avg)}</strong></div><div class="muted small">${esc(s.category)} · ${s.cadence} · ${s.count} occurrences · ${s.confidence}</div><div class="stat-row"><span>Monthly equivalent</span><strong>${money(s.monthly)}</strong></div><div class="stat-row"><span>Next expected</span><strong>${s.next}</strong></div><div class="actions"><button class="btn primary" onclick="keepSuggestion('${encodeURIComponent(s.key)}')">Keep</button><button class="btn" onclick="ignoreSuggestion('${encodeURIComponent(s.key)}')">Ignore</button></div></div>`}
function keepSuggestion(k){let s=detect().find(x=>x.key===decodeURIComponent(k));if(!s)return;let obj={id:crypto.randomUUID(),name:s.merchant,service:s.merchant,category:s.category,amount:s.avg,cadence:s.cadence,nextDate:s.next,nextRenewal:s.next,active:true};(s.subscription?state.subscriptions:state.recurring).push(obj);save();render()}
function ignoreSuggestion(k){state.dismissed.push(decodeURIComponent(k));save();render()}
function confirmedItem(x,type){return `<div class="item"><div class="item-head"><strong>${esc(x.name||x.service)}</strong><strong>${money(x.amount)}</strong></div><div class="muted small">${esc(x.category||'')} · ${esc(x.cadence||'')} · next ${esc(x.nextDate||x.nextRenewal||'')}</div><div class="actions"><button class="btn" onclick="editConfirmed('${x.id}','${type}')">Edit</button><button class="btn danger" onclick="removeConfirmed('${x.id}','${type}')">Delete</button></div></div>`}
function removeConfirmed(id,type){if(confirm('Delete this confirmed item?')){let k=type==='recurring'?'recurring':'subscriptions';state[k]=state[k].filter(x=>x.id!==id);save();render()}}
function editConfirmed(id,type){let k=type==='recurring'?'recurring':'subscriptions',x=state[k].find(y=>y.id===id);showModal(`<div class="modal-head"><h3>Edit ${type}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="formgrid"><div class="field"><label>Name</label><input id="mName" value="${esc(x.name||x.service)}"></div><div class="field"><label>Amount</label><input id="mAmount" type="number" value="${x.amount}"></div><div class="field"><label>Cadence</label><select id="mCad">${['weekly','biweekly','monthly','quarterly','annual'].map(c=>`<option ${x.cadence===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Next date</label><input id="mDate" type="date" value="${esc(x.nextDate||x.nextRenewal||'')}"></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveConfirmed('${id}','${type}')">Save</button></div>`)}
function saveConfirmed(id,type){let k=type==='recurring'?'recurring':'subscriptions',x=state[k].find(y=>y.id===id);x.name=document.getElementById('mName').value.trim();x.service=x.name;x.amount=Number(document.getElementById('mAmount').value);x.cadence=document.getElementById('mCad').value;x.nextDate=document.getElementById('mDate').value;x.nextRenewal=x.nextDate;save();closeModal();render()}
function manualRecurring(){manualItem('recurring')}function manualSubscription(){manualItem('subscription')}
function manualItem(type){showModal(`<div class="modal-head"><h3>Add ${type==='recurring'?'recurring payment':'subscription'}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="formgrid"><div class="field"><label>${type==='recurring'?'Name':'Service name'}</label><input id="mName"></div><div class="field"><label>Amount</label><input id="mAmount" type="number" min="0.01"></div><div class="field"><label>Category</label><select id="mCat">${state.categories.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Cadence</label><select id="mCad">${['weekly','biweekly','monthly','quarterly','annual'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Next date</label><input id="mDate" type="date" value="${today()}"></div><div class="field"><label>Account</label><select id="mAcc"><option></option>${state.accounts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveManual('${type}')">Save</button></div>`)}
function saveManual(type){let name=document.getElementById('mName').value.trim(),amount=Number(document.getElementById('mAmount').value);if(!name||amount<=0){alert('Enter a name and positive amount.');return}let x={id:crypto.randomUUID(),name,service:name,amount,category:document.getElementById('mCat').value,cadence:document.getElementById('mCad').value,nextDate:document.getElementById('mDate').value,nextRenewal:document.getElementById('mDate').value,account:document.getElementById('mAcc').value,active:true};(type==='recurring'?state.recurring:state.subscriptions).push(x);save();closeModal();render()}

function budgets(){let rows=state.budgets.map(b=>{let spent=state.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date.slice(0,7)===today().slice(0,7)).reduce((a,t)=>a+t.amount,0);let pct=b.limit?spent/b.limit*100:0;return `<div class="item"><div class="item-head"><strong>${esc(b.category)}</strong><span>${money(spent)} / ${money(b.limit)}</span></div><div class="stat-row"><span>${pct>100?'Over budget':money(Math.max(0,b.limit-spent))+' remaining'}</span><strong>${pct.toFixed(0)}%</strong></div><div class="bar ${pct>100?'dangerbar':''}"><i style="width:${Math.min(100,pct)}%"></i></div><div class="actions"><button class="btn" onclick="editBudget('${b.id}')">Adjust</button><button class="btn danger" onclick="deleteBudget('${b.id}')">Delete</button></div></div>`});let health=state.budgets.length?state.budgets.filter(b=>{let s=state.transactions.filter(t=>t.type==='expense'&&t.category===b.category&&t.date.slice(0,7)===today().slice(0,7)).reduce((a,t)=>a+t.amount,0);return s<=b.limit}).length/state.budgets.length*100:0;return `<div class="page-title"><div><h1>Budgets</h1><div class="muted">Monthly limits calculated from real expense transactions.</div></div><button class="btn primary" onclick="budgetModal()">＋ Create budget</button></div>${state.budgets.length?`<div class="card"><div class="stat-row"><strong>Budget health</strong><strong>${health.toFixed(0)}%</strong></div><div class="bar"><i style="width:${health}%"></i></div></div><div class="list section">${rows.join('')}</div>`:`<div class="card empty"><div><strong>No budgets yet</strong>Create a budget to start tracking category limits.</div></div>`}`}
function budgetModal(id){let b=id&&state.budgets.find(x=>x.id===id);showModal(`<div class="modal-head"><h3>${b?'Adjust':'Create'} budget</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="formgrid"><div class="field"><label>Category</label><select id="bCat">${state.categories.map(x=>`<option ${b?.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Monthly limit</label><input id="bLimit" type="number" min="0.01" value="${b?.limit||''}"></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveBudget('${b?.id||''}')">Save</button></div>`)}
function saveBudget(id){let category=document.getElementById('bCat').value,limit=Number(document.getElementById('bLimit').value);if(!limit||limit<=0)return alert('Enter a positive limit.');if(id){Object.assign(state.budgets.find(x=>x.id===id),{category,limit,active:true})}else state.budgets.push({id:crypto.randomUUID(),category,limit,active:true});save();closeModal();render()}
function editBudget(id){budgetModal(id)}function deleteBudget(id){if(confirm('Delete this budget?')){state.budgets=state.budgets.filter(x=>x.id!==id);save();render()}}

function goals(){return `<div class="page-title"><div><h1>Goals</h1><div class="muted">Track targets without inventing contributions.</div></div><button class="btn primary" onclick="goalModal()">＋ Create goal</button></div>${state.goals.length?`<div class="grid three">${state.goals.map(g=>`<div class="card"><div class="item-head"><strong>${esc(g.name)}</strong><span>${g.due||'No due date'}</span></div><div class="metric">${money(g.current)} <span class="muted small">/ ${money(g.target)}</span></div><div class="bar"><i style="width:${Math.min(100,g.target?g.current/g.target*100:0)}%"></i></div><div class="stat-row"><span>${money(Math.max(0,g.target-g.current))} remaining</span><strong>${(g.target?g.current/g.target*100:0).toFixed(0)}%</strong></div>${g.note?`<div class="muted small">${esc(g.note)}</div>`:''}<div class="actions"><button class="btn" onclick="goalModal('${g.id}')">Edit</button><button class="btn danger" onclick="deleteGoal('${g.id}')">Delete</button></div></div>`).join('')}</div>`:`<div class="card empty"><div><strong>No goals yet</strong>Create a goal to track a real target amount.</div></div>`}`}
function goalModal(id){let g=id&&state.goals.find(x=>x.id===id);showModal(`<div class="modal-head"><h3>${g?'Edit':'Create'} goal</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="formgrid"><div class="field"><label>Name</label><input id="gName" value="${esc(g?.name||'')}"></div><div class="field"><label>Target amount</label><input id="gTarget" type="number" value="${g?.target||''}"></div><div class="field"><label>Current saved amount</label><input id="gCurrent" type="number" value="${g?.current||''}"></div><div class="field"><label>Due date (optional)</label><input id="gDue" type="date" value="${esc(g?.due||'')}"></div><div class="field full"><label>Note (optional)</label><textarea id="gNote">${esc(g?.note||'')}</textarea></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGoal('${g?.id||''}')">Save</button></div>`)}
function saveGoal(id){let name=document.getElementById('gName').value.trim(),target=Number(document.getElementById('gTarget').value),current=Number(document.getElementById('gCurrent').value||0);if(!name||target<=0||current<0)return alert('Enter a name, positive target and valid current amount.');let o={name,target,current,due:document.getElementById('gDue').value,note:document.getElementById('gNote').value.trim()};if(id)Object.assign(state.goals.find(x=>x.id===id),o);else state.goals.push({id:crypto.randomUUID(),...o});save();closeModal();render()}
function deleteGoal(id){if(confirm('Delete this goal?')){state.goals=state.goals.filter(x=>x.id!==id);save();render()}}

function documents(){return `<div class="page-title"><div><h1>Documents</h1><div class="muted">Receipts, statements and imported files.</div></div><button class="btn primary" onclick="openImport()">↑ Upload documents</button></div><div class="grid two"><div class="card"><h2>Upload documents</h2><p class="muted">Multiple receipts, statements, invoices, PDFs, images, CSVs and supported spreadsheets. Maximum 20 MB each.</p><button class="btn primary" onclick="openImport()">Choose files</button></div><div class="card"><h2>Google Drive inbox</h2><strong>${esc(state.drive.folderName)}</strong><p class="muted small">${state.drive.folderUrl?`<a href="${esc(state.drive.folderUrl)}" target="_blank" rel="noopener">View folder</a>`:'Folder link not configured in standalone mode.'}</p><div class="stat-row"><span>Schedule</span><strong>${esc(state.drive.schedule)}</strong></div><div class="stat-row"><span>Timezone</span><strong>${esc(state.drive.timezone)}</strong></div><div class="stat-row"><span>Last sync</span><strong>${state.drive.lastSync||'Never'}</strong></div><button class="btn" onclick="sync()">Run sync check</button></div></div><div class="card section"><h2>Document vault</h2>${state.documents.length?`<div class="list">${state.documents.map(d=>`<div class="item"><div class="item-head"><strong>${esc(d.filename)}</strong><span>${esc(d.status)}</span></div><div class="muted small">${esc(d.mimeType)} · ${Math.round(d.size/1024)} KB · ${esc(d.source)}</div></div>`).join('')}</div>`:`<div class="empty"><div><strong>No documents yet</strong>Upload a file or add one to your Drive inbox.</div></div>`}</div>`}
function sync(){state.drive.lastSync=new Date().toLocaleString();state.drive.status='Standalone check complete';save();alert('Standalone mode cannot access Google Drive or a protected Site endpoint. The sync status was recorded locally; no Drive data was imported.');render()}

function rules(){return `<div class="page-title"><div><h1>Rules & tags</h1><div class="muted">Manage future categorization rules and simple tags.</div></div><div class="actions"><button class="btn" onclick="tagCreate()">＋ Create tag</button><button class="btn primary" onclick="ruleModal()">＋ Create rule</button></div></div><div class="grid two"><div class="card"><h2>Categorization rules</h2>${state.rules.length?`<div class="list">${state.rules.map(r=>`<div class="item"><div><strong>When</strong> ${esc(r.whenText)}<br><strong>Then</strong> ${esc(r.thenText)}</div><div class="actions"><button class="btn" onclick="toggleRule('${r.id}')">${r.enabled?'Enabled':'Disabled'}</button><button class="btn danger" onclick="deleteRule('${r.id}')">Delete</button></div></div>`).join('')}</div>`:`<div class="empty"><div><strong>No rules yet</strong>Create a rule for future imports.</div></div>`}</div><div class="card"><h2>Tags</h2>${state.tags.length?`<div class="list">${state.tags.map(t=>`<div class="item item-head"><strong>${esc(t)}</strong><span>${state.transactions.filter(x=>(x.tags||[]).some(y=>y.toLowerCase()===t.toLowerCase())).length} uses <button class="btn" onclick="deleteTag('${encodeURIComponent(t)}')">Delete</button></span></div>`).join('')}</div>`:`<div class="empty"><div><strong>No tags yet</strong>Create a simple tag name.</div></div>`}</div></div>`}
function ruleModal(){showModal(`<div class="modal-head"><h3>Create rule</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="formgrid"><div class="field full"><label>When</label><input id="rWhen" placeholder="Merchant or source condition"></div><div class="field full"><label>Then</label><input id="rThen" placeholder="Target category and/or tag action"></div><div class="field full"><label><input id="rEnabled" type="checkbox" checked> Enabled</label></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRule()">Save</button></div>`)}
function saveRule(){let whenText=document.getElementById('rWhen').value.trim(),thenText=document.getElementById('rThen').value.trim();if(!whenText||!thenText)return alert('Both fields are required.');state.rules.push({id:crypto.randomUUID(),whenText,thenText,enabled:document.getElementById('rEnabled').checked});save();closeModal();render()}
function toggleRule(id){let x=state.rules.find(r=>r.id===id);x.enabled=!x.enabled;save();render()}function deleteRule(id){if(confirm('Delete this rule?')){state.rules=state.rules.filter(x=>x.id!==id);save();render()}}
function tagCreate(){showModal(`<div class="modal-head"><h3>Create tag</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Tag name</label><input id="tagName" autofocus></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTag()">Create</button></div>`)}
function saveTag(){let n=document.getElementById('tagName').value.trim();if(!n)return;if(state.tags.some(x=>x.toLowerCase()===n.toLowerCase()))return alert('That tag already exists.');state.tags.push(n);save();closeModal();render()}
function deleteTag(k){let t=decodeURIComponent(k);if(confirm(`Delete "${t}" from future selectors? Existing transaction labels are retained.`)){state.tags=state.tags.filter(x=>x.toLowerCase()!==t.toLowerCase());save();render()}}

function settings(){let ignored=state.dismissed.length;return `<div class="page-title"><div><h1>Settings</h1><div class="muted">Durable preferences for this standalone browser build.</div></div></div><div class="grid two"><div class="card"><h2>Net worth setup</h2><p class="muted">Net Worth is assets minus liabilities; it is not calculated from monthly cash flow.</p><div class="formgrid"><div class="field"><label>Total assets</label><input id="sAssets" type="number" value="${state.assets}"></div><div class="field"><label>Total liabilities</label><input id="sLiab" type="number" value="${state.liabilities}"></div></div><div class="stat-row" style="margin-top:14px"><strong>Preview</strong><strong>${money(state.assets-state.liabilities)}</strong></div><button class="btn primary" onclick="saveNetWorth()">Save totals</button></div><div class="card"><h2>Automatic detection</h2><p class="muted">Recurring detection groups repeated expenses by normalized merchant and tests real date intervals and amount stability. Suggestions require user confirmation.</p><div class="stat-row"><span>Ignored suggestions</span><strong>${ignored}</strong></div><button class="btn" onclick="restoreIgnored()">Restore ignored suggestions</button></div></div><div class="grid two section"><div class="card"><h2>Managed categories</h2>${manageList(state.categories,'category')}</div><div class="card"><h2>Managed accounts</h2>${manageList(state.accounts,'account')}</div></div><div class="card section"><h2>Tags</h2>${manageList(state.tags,'tag')}</div><div class="card section"><h2>Google Drive sync</h2><div class="stat-row"><span>Folder</span><strong>${esc(state.drive.folderName)}</strong></div><div class="stat-row"><span>Schedule</span><strong>${esc(state.drive.schedule)}</strong></div><div class="stat-row"><span>Timezone</span><strong>${esc(state.drive.timezone)}</strong></div><div class="stat-row"><span>Last sync</span><strong>${state.drive.lastSync||'Never'}</strong></div><p class="muted small">Add a receipt, CSV, statement, invoice or supported document to the dedicated folder. A real Sites deployment is required for secure daily Drive ingestion.</p></div><div class="card section"><h2>Danger zone</h2><p class="muted">Erase all Ledgerly data stored by this standalone browser. This does not touch Google Drive.</p><button class="btn danger" onclick="wipe()">Erase all Ledgerly data</button></div>`}
function manageList(arr,type){return `<div class="list">${arr.length?arr.map(x=>`<div class="item item-head"><span>${esc(x)}</span><button class="btn" onclick="removeManaged('${encodeURIComponent(x)}','${type}')">Remove</button></div>`).join(''): '<div class="muted">None configured.</div>'}</div><button class="btn" style="margin-top:10px" onclick="addManaged('${type}')">＋ Add ${type}</button>`}
function addManaged(type){let label=type==='tag'?'tag':type;showModal(`<div class="modal-head"><h3>Add ${label}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Name</label><input id="managedName"></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveManaged('${type}')">Add</button></div>`)}
function saveManaged(type){let n=document.getElementById('managedName').value.trim(),k=type==='category'?'categories':type==='account'?'accounts':'tags';if(!n)return;if(state[k].some(x=>x.toLowerCase()===n.toLowerCase()))return alert('An item with that name already exists.');state[k].push(n);save();closeModal();render()}
function removeManaged(k,type){let n=decodeURIComponent(k),key=type==='category'?'categories':type==='account'?'accounts':'tags';if(type==='category'&&state.transactions.some(x=>x.category===n))alert('This category is used by historical transactions; remove it from future pickers only.');if(type==='account'&&state.transactions.some(x=>x.account===n))alert('This account is used by historical transactions; remove it from future pickers only.');if(confirm(`Remove "${n}" from future selectors?`)){state[key]=state[key].filter(x=>x!==n);save();render()}}
function saveNetWorth(){let a=Number(document.getElementById('sAssets').value||0),l=Number(document.getElementById('sLiab').value||0);if(a<0||l<0)return alert('Totals cannot be negative.');state.assets=a;state.liabilities=l;state.netWorthConfigured=true;save();render()}
function restoreIgnored(){state.dismissed=[];save();render()}
function wipe(){showModal(`<div class="modal-head"><h3>Erase all Ledgerly data</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><p>This deletes browser-stored transactions, documents, rules, tags, budgets, goals, subscriptions, recurring entries and settings. Original Google Drive files are not affected.</p><div class="field"><label>Type DELETE to continue</label><input id="wipeConfirm" oninput="document.getElementById('wipeBtn').disabled=this.value!=='DELETE'"></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button id="wipeBtn" class="btn danger" disabled onclick="doWipe()">Erase all data</button></div>`)}
function doWipe(){localStorage.removeItem('ledgerly-standalone');state=structuredClone(defaultState);closeModal();render()}
function showModal(x){document.getElementById('modal').innerHTML=x;document.getElementById('modalBg').classList.add('show');setTimeout(()=>document.querySelector('#modal input')?.focus(),50)}
function closeModal(){document.getElementById('modalBg').classList.remove('show');document.getElementById('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body>
</html>'''
path=Path("/mnt/data/Ledgerly_standalone.html")
path.write_text(html,encoding="utf-8")
